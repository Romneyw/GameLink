<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameLink | Messages</title>
<link rel="stylesheet" href="chat.css?v=2">
</head>
<body>
<header><nav><a class="logo" href="dashboard.html">🎮 <span>Game</span>Link</a><div class="nav-links"><a class="back teammates-link" href="teammates.html">Find Teammates</a><a class="back" href="chat.html">Messages <span data-unread-total hidden></span></a><a class="back" href="dashboard.html">My Account</a></div></nav></header>
<main>
<div class="page-intro"><div><p class="tag">YOUR SQUAD, ONE MESSAGE AWAY</p><h1>Messages</h1></div><p class="muted">Find your people. Plan your next game.</p></div>
<p id="account-status" role="status">Checking your account…</p><button id="retry-account" hidden>Try Again</button>
<div class="layout" id="app" data-view="inbox" hidden>
<aside class="panel inbox"><div class="inbox-heading"><h2>Your conversations</h2><button id="refresh-inbox" type="button">Refresh</button></div><p class="muted" id="inbox-status" role="status">Loading…</p><div class="threads" id="threads"></div><div class="pager"><button id="prev-inbox" hidden>← Newer</button><button id="next-inbox" hidden>Older →</button></div></aside>
<section class="panel" id="conversation-panel" aria-label="Private conversation">
<div class="chat-head"><a href="chat.html" class="back back-messages" aria-label="Back to Messages">←</a><span class="avatar" id="chat-avatar" aria-hidden="true">GL</span><div class="chat-heading"><h2 id="chat-name">Choose a teammate</h2><p class="muted" id="chat-detail">Private conversation</p></div><button id="refresh" type="button" aria-label="Refresh conversation">Refresh</button></div>
<div class="controls"><button id="older" hidden>Load older messages</button></div>
<p class="notice" id="chat-status" role="status"></p>
<div id="messages" class="messages" aria-label="Message history" tabindex="0"><p class="empty">Loading this conversation…</p></div>
<button type="button" id="new-messages" hidden>New messages ↓</button>
<form class="composer" id="composer" hidden><label for="message">Your message</label><div class="compose-row"><textarea id="message" maxlength="2000" required rows="1" placeholder="Message your teammate…"></textarea><button class="primary" id="send" type="submit">Send →</button></div><div class="send-row"><span class="muted" id="send-status" role="status"></span><span class="muted">2,000 characters max</span></div></form>
</section>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="gamelink-notifications.js?v=1"></script>
<script src="chat.js?v=2"></script>
</body>
</html>
