<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameLink | Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav>
        <div class="logo">🎮 <span>Game</span>Link</div>

        <div class="nav-buttons">
            <a href="index.html">
                <button class="login">Back Home</button>
            </a>
        </div>
    </nav>
</header>

<section class="auth-section">

    <div class="auth-box">

        <p class="tag">JOIN GAMELINK</p>

        <h1>Create Your Account</h1>

        <p class="auth-text">
            Join gamers, find teammates, and build your squad.
        </p>

      <form id="signup-form">

            <label>Username</label>
            <input type="text" placeholder="Enter your username" required>

            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" placeholder="Create a password" required>

            <button type="submit" class="main-button">
                Create Account →
            </button>

        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</section>

<footer>
    <div class="logo">🎮 <span>Game</span>Link</div>
    <p>Find your squad. Play together.</p>
</footer>

</body>
</html>
