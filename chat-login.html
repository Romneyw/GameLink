<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameLink | Join the conversation</title><link rel="stylesheet" href="style.css"><style>[hidden]{display:none!important}.auth-box{max-width:520px}button{font:inherit}.mode{display:flex;gap:12px;margin:20px 0}.mode button{flex:1;padding:12px;background:#171924;color:white;border:1px solid #484b60;border-radius:9px;cursor:pointer}.mode button[aria-pressed=true]{border-color:#ff174f;background:#ff174f25}.auth-box a{color:#ff7597}.auth-box #status{margin:20px 0;line-height:1.6}.auth-box button:disabled{opacity:.6}.auth-box input{width:100%}</style></head>
<body><header><nav><a class="logo" href="index.html">🎮 <span>Game</span>Link</a></nav></header>
<main class="auth-section"><section class="auth-box"><p class="tag">YOUR NEXT TEAMMATE</p><h1>Join the conversation</h1><p class="auth-text">Log in or create your free account. We’ll open the chat with this gamer.</p>
<div class="mode"><button type="button" id="login-mode" aria-pressed="true">Log in</button><button type="button" id="signup-mode" aria-pressed="false">Sign up</button></div>
<form id="auth-form"><div id="name-field" hidden><label for="username">Gamer name</label><input id="username" maxlength="40" autocomplete="nickname"></div><label for="email">Email</label><input id="email" type="email" required autocomplete="username"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><button id="submit" class="main-button" disabled>Log in &amp; open chat →</button></form>
<p id="status" role="status">Connecting…</p><p><a id="back-card" href="gamer-card.html">← Back to gamer card</a></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="chat-login.js?v=1"></script></body></html>
