<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameLink | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav>
        <div class="logo">🎮 <span>Game</span>Link</div>

        <div class="nav-buttons">
            <a href="index.html" class="login">Back Home</a>
        </div>
    </nav>
</header>

<section class="auth-section">
    <div class="auth-box">
        <p class="tag">WELCOME BACK</p>

        <h1>Login to GameLink</h1>

        <p class="auth-text">
            Your squad is waiting. Let’s play together.
        </p>

        <form id="login-form">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="main-button" disabled>
                Login →
            </button>
        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>
    </div>
</section>

<footer>
    <div class="logo">🎮 <span>Game</span>Link</div>
    <p>Find your squad. Play together.</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
